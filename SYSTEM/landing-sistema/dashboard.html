<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDT · System</title>
<link rel="icon" href="marca/tdt-icono.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;background:#000;color:#F2F2F2}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.gate{min-height:100vh;display:grid;place-items:center;color:#8A8A8A;font-size:13px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#000}
</style>
</head>
<body>
<div class="gate" id="gate" role="status">Verificando acceso…</div>
<div id="app" hidden>
  <iframe id="sistema" title="TDT System · Dashboard maestro"></iframe>
</div>
<script>
// DASHBOARD TDT · solo con la sesión de System que crea el servidor local al validar el PIN.
(function(){
  function volver(){document.getElementById('sistema').removeAttribute('src');location.replace('system.html')}
  fetch('/_tdt/session').then(function(r){
    if(r.status!==204){volver();return}
    document.getElementById('sistema').src='/sistema/dashboard-maestro.html'+(location.hash||'');
    document.getElementById('gate').hidden=true;
    document.getElementById('app').hidden=false;
  }).catch(function(){document.getElementById('gate').textContent='No se pudo conectar con el sistema local. Recargá para reintentar.'});
})();
</script>

</body>
</html>
