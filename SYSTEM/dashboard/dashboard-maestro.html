<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDT · Dashboard maestro</title>
<link rel="icon" href="/marca/tdt-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{color-scheme:dark;--text:#F4F4F5;--soft:#A1A1AA;--muted:#63636B;--glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.07);--edge:rgba(255,255,255,.08);--edge2:rgba(255,255,255,.16);--sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:2px}
/* fondo vivo */
.inicio .bg{display:none}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg i:nth-child(1){width:620px;height:620px;left:48%;top:-260px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(2){width:520px;height:520px;left:8%;bottom:-280px;background:radial-gradient(circle,rgba(170,170,190,.18),transparent 70%);animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-90px,70px) scale(1.12)}}
.shell{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);gap:14px;padding:14px}
/* barra lateral */
.sidebar{position:sticky;top:14px;height:calc(100vh - 28px);padding:22px 14px 16px;border:1px solid var(--edge);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(18px);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand svg{width:58px;height:auto;display:block}
.brand small{padding:3px 9px;border:1px solid var(--edge2);border-radius:99px;color:var(--soft);font-size:11px;letter-spacing:.02em}
.nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav .grow{flex:1}
.nav-label{padding:16px 12px 6px;color:var(--muted);font-size:11px;letter-spacing:.04em}
.nav button{border:0;background:none;color:var(--soft);text-align:left;padding:9px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13.5px;transition:background .2s,color .2s}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav button:hover{background:var(--glass);color:var(--text)}
.nav button.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px var(--edge2),0 8px 24px -10px rgba(255,255,255,.35)}
.nav button.active svg{opacity:1}
.sidebar-foot{margin-top:auto;display:flex;gap:8px;padding-top:14px}
.sidebar-foot a,.sidebar-foot button{flex:1;text-align:center;border:1px solid var(--edge);background:var(--glass);border-radius:12px;padding:9px 6px;cursor:pointer;color:var(--soft);font-size:12px;transition:.2s}
.sidebar-foot a:hover,.sidebar-foot button:hover{color:var(--text);border-color:var(--edge2)}
/* área principal */
.main{min-width:0}
.top{position:sticky;top:14px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 20px;border:1px solid var(--edge);border-radius:18px;background:rgba(10,10,12,.6);backdrop-filter:blur(18px)}
.crumb{color:var(--soft);font-size:13px}
.crumb b{color:var(--text);font-weight:500}
.chips{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);color:var(--soft);font-size:12px;white-space:nowrap}
.chip b{color:var(--text);font:400 12px/1 var(--mono);font-variant-numeric:tabular-nums}
.page{max-width:1160px;margin:0 auto;padding:40px 12px 80px;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* inicio */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.04em}
.hero h1{margin:8px 0 0;font-size:clamp(46px,6vw,84px);line-height:.9;letter-spacing:-.06em;font-weight:500;background:linear-gradient(180deg,#fff 30%,#8a8a92);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .when{text-align:right}
.hero .clock{display:block;margin-top:4px;font:300 40px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .date{color:var(--soft);font-size:13px;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:32px}
.card{border:1px solid var(--edge);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));backdrop-filter:blur(14px);transition:transform .25s,border-color .25s,box-shadow .25s}
.stat{padding:18px 20px}
.stat span{color:var(--soft);font-size:12px}
.stat b{display:block;margin-top:10px;font-size:30px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.now{display:grid;grid-template-columns:1.4fr .8fr;gap:12px;margin-top:12px}
.focus,.decision{min-height:190px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.focus{background:radial-gradient(500px 220px at 0% 0%,rgba(255,255,255,.1),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.focus h2{margin:10px 0 0;max-width:620px;font-size:26px;line-height:1.2;letter-spacing:-.03em;font-weight:500}
.decision strong{display:block;margin-top:10px;font-size:20px;line-height:1.3;letter-spacing:-.02em;font-weight:500}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--edge2);color:var(--soft);font-size:12px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pill.on{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.pill.on i{background:#fff;box-shadow:0 0 8px #fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s}
.btn.pri{background:#fff;color:#000;box-shadow:0 8px 30px -8px rgba(255,255,255,.5)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 12px 34px -8px rgba(255,255,255,.7)}
.btn.sec{background:var(--glass2);color:var(--text);border:1px solid var(--edge2)}
.btn.sec:hover{background:rgba(255,255,255,.12)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 4px 14px}
.section-head h2{margin:0;font-size:18px;font-weight:500;letter-spacing:-.02em}
.section-head span{color:var(--muted);font-size:12px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.unit{padding:20px;min-height:176px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.unit .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge)}
.unit .ico svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.unit h3{margin:14px 0 0;font-size:20px;font-weight:500;letter-spacing:-.03em}
.unit p{margin:0;color:var(--soft);font-size:13px}
.unit .pill{margin-top:auto;align-self:flex-start}
.unit[data-on="1"]{background:radial-gradient(300px 160px at 100% 0%,rgba(255,255,255,.14),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.card.hover:hover{transform:translateY(-3px);border-color:var(--edge2);box-shadow:0 18px 50px -20px rgba(255,255,255,.3)}
.system-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.system-card{padding:18px 20px;text-align:left;cursor:pointer}
.system-card .tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--glass2);color:var(--soft);font-size:11px}
.system-card strong{display:block;margin-top:12px;font-size:16px;font-weight:500;letter-spacing:-.02em}
.system-card p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
/* detalle */
.back{background:var(--glass);border:1px solid var(--edge);border-radius:99px;color:var(--soft);padding:6px 12px;cursor:pointer;font-size:12px}
.back:hover{color:var(--text)}
.view-head h1{margin:18px 0 8px;font-size:clamp(34px,4.6vw,54px);letter-spacing:-.05em;font-weight:500;line-height:1}
.view-head p{margin:0;max-width:640px;color:var(--soft);font-size:14px}
.view-head .row{justify-content:flex-start;margin-top:20px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:28px}
.detail-block{padding:20px 22px}
.detail-block h2{margin:0 0 12px;font-size:14px;font-weight:500}
.detail-block ul{list-style:none;margin:0;padding:0}
.detail-block li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);color:var(--soft);font-size:13px}
.detail-block li:first-child{border-top:0}
.detail-block li::before{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
/* memoria viva */
.memory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:28px}
.memory-card{padding:20px 22px;text-align:left;cursor:pointer;color:var(--text)}
.memory-card:hover{border-color:var(--edge2);background:var(--glass2)}
.memory-card .memory-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.memory-card h2{margin:0;font-size:17px;font-weight:500}
.memory-card .count{color:var(--muted);font:11px/1 var(--mono)}
.memory-card p{min-height:38px;margin:12px 0 18px;color:var(--soft);font-size:13px;line-height:1.45}
.memory-card footer{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--edge);color:var(--muted);font:11px/1.3 var(--mono)}
.memory-content{display:none;grid-column:1/-1;padding:26px 28px;max-height:62vh;overflow:auto}
.memory-content.open{display:block;animation:rise .25s ease}
.memory-content .doc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.memory-content .doc-head strong{font-size:18px;font-weight:500}.memory-content .doc-head span{color:var(--muted);font:11px/1 var(--mono)}
.memory-content h2{margin:26px 0 10px;font-size:21px;font-weight:500}.memory-content h3{margin:22px 0 8px;font-size:16px;font-weight:500}
.memory-content p{margin:6px 0;color:var(--soft);font-size:13px;line-height:1.55}.memory-content p.bullet{padding-left:18px;position:relative}.memory-content p.bullet::before{content:'•';position:absolute;left:2px;color:var(--text)}
.memory-content p.mono{white-space:pre-wrap;font:11.5px/1.55 var(--mono);color:var(--muted)}
/* global */
.unit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.unit-head h1{margin:12px 0 8px;font-size:clamp(42px,6vw,72px);font-weight:500;letter-spacing:-.055em;line-height:.95}
.unit-head p{margin:0;color:var(--soft);font-size:14px}.unit-actions{display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.fact{padding:18px 20px}.fact strong{display:block;font-size:25px;font-weight:500;letter-spacing:-.04em}.fact span{display:block;margin-top:5px;color:var(--muted);font-size:11.5px}
.work-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.work{padding:22px}
.work .tag{color:var(--muted);font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}.work h2{margin:12px 0 14px;font-size:18px;font-weight:500}
.work ul{list-style:none;margin:0;padding:0}.work li{padding:9px 0;border-top:1px solid var(--edge);color:var(--soft);font-size:13px}.work li:first-child{border-top:0}
.pending-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:12px;padding:18px 22px}.pending-row div{display:flex;align-items:center;gap:12px}.pending-row p{margin:0;color:var(--soft);font-size:13px}
@media(max-width:850px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.work-grid{grid-template-columns:1fr}}
/* mapa */
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.folder{padding:20px 22px}
.folder h3{display:flex;align-items:center;gap:10px;margin:0;font-size:17px;font-weight:500;letter-spacing:-.02em}
.folder h3 svg,.sub svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.folder>p{margin:6px 0 0;color:var(--soft);font-size:13px}
.sub{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.sub b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.sub p{margin:4px 0 0 25px;color:var(--muted);font-size:12.5px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 25px}
.files span{padding:3px 9px;border-radius:99px;background:var(--glass2);color:var(--soft);font:400 11.5px/1.4 var(--mono)}
.files span.d{color:var(--text)}
.routes{padding:8px 20px}
.route{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.route:first-child{border-top:0}
.route .name{flex:1;font-size:13.5px}
.route a{color:var(--soft);font:400 12px/1 var(--mono)}
.route a:hover{color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:#444;flex:none}
.dot.on{background:#fff;box-shadow:0 0 8px #fff}
.rev{display:flex;flex-wrap:wrap;gap:8px;padding:18px 20px}
.rev span{padding:6px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);color:var(--soft);font-size:12.5px}
/* árbol de carpetas */
.tree{padding:26px 28px}
.tree ul{list-style:none;margin:0;padding:0 0 0 30px}
.tree>ul{padding-left:0}
.tree li{position:relative;padding:5px 0}
.tree ul ul li::before{content:"";position:absolute;left:-18px;top:0;bottom:0;border-left:1px solid var(--edge2)}
.tree ul ul li:last-child::before{bottom:auto;height:25px}
.tree ul ul li::after{content:"";position:absolute;left:-18px;top:25px;width:12px;border-top:1px solid var(--edge2)}
.node{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:9px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass)}
.node svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.8}
.node b{font-weight:500;font-size:14px}
.node em{font-style:normal;color:var(--soft);font-size:13px}
.node em::before{content:"←  ";color:var(--muted)}
.node em{display:none}
li.open>.node em{display:inline}
.node.top{padding:12px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:var(--edge2)}
.node.top b{font-size:17px;letter-spacing:-.01em}
.node.root{padding:12px 20px;background:#fff;color:#000;border-color:#fff}
.node.root em{color:#444}.node.root em::before{color:#888}
.node.old{border-style:dashed}
.chips-old{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 30px}
.chips-old span{padding:4px 10px;border-radius:99px;background:var(--glass2);color:var(--soft);font-size:12px}
/* árbol plegable */
.node{cursor:default;font:inherit;color:inherit;text-align:left}
button.node{cursor:pointer}
button.node:hover{border-color:var(--edge2);background:var(--glass2)}
.node .chev{width:14px;height:14px;transition:transform .2s;opacity:.6}
li.open>.node .chev{transform:rotate(90deg)}
li>ul{display:none}
li.open>ul{display:block;animation:rise .25s ease}
.old-list{display:none}
li.open>.old-list{display:flex}
.node .count{margin-left:2px;padding:1px 8px;border-radius:99px;background:var(--glass2);color:var(--soft);font-size:11px}
/* pantallas angostas: la barra queda al costado, solo con íconos */
@media(max-width:900px){.stats,.units{grid-template-columns:repeat(2,minmax(0,1fr))}.now{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.shell{grid-template-columns:68px minmax(0,1fr);gap:10px;padding:10px}.sidebar{top:10px;height:calc(100vh - 20px);padding:16px 8px;border-radius:18px;align-items:center}.brand{padding:0 0 14px}.brand svg{width:40px}.brand small,.nav-label,.nav button span{display:none}.nav button{justify-content:center;padding:11px}.sidebar-foot{flex-direction:column}.sidebar-foot a,.sidebar-foot button{padding:10px}.sidebar-foot span{display:none}.sidebar-foot a::before{content:"←";font-size:14px}.sidebar-foot button::before{content:"⏻";font-size:14px}.top{top:10px;padding-left:14px}.chip.hide-s{display:none}.page{padding:28px 4px 60px}.hero .when{text-align:left}}
/* barra lateral solo con íconos (los nombres quedan como ayuda al pasar el mouse) */
.shell{grid-template-columns:76px minmax(0,1fr)}
.sidebar{padding:18px 10px 14px;align-items:center}
.brand{padding:0 0 16px}.brand svg{width:44px}
.brand small,.nav-label,.nav button span,.sidebar-foot span{display:none}
.nav{align-items:center}
.nav button{justify-content:center;padding:11px}
.nav-sep{height:12px}
.sidebar-foot{flex-direction:column}
.sidebar-foot a,.sidebar-foot button{padding:10px 12px}
.sidebar-foot a::before{content:"←";font-size:14px}
.sidebar-foot button::before{content:"⏻";font-size:14px}
@media(max-width:820px){.shell{grid-template-columns:68px minmax(0,1fr)}}
</style>
</head>

<script>
// Apartados tomados del dashboard anterior (TDT_REVISION/dashboard-maestro-conceptual-2026-09-23, REUTILIZABLE).
// Los estados de cada unidad reflejan solo lo que existe hoy en TDT NUEVO.
const LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const I={
 inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 direccion:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 global:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
 growth:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 digital:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',

function memoryMarkup(text){
 return String(text).split('\n').map(l=>{
  if(/^###\s+/.test(l))return '<h3>'+esc(l.replace(/^###\s+/,''))+'</h3>';
  if(/^##\s+/.test(l))return '<h2>'+esc(l.replace(/^##\s+/,''))+'</h2>';
  if(/^#\s+/.test(l))return '<h2>'+esc(l.replace(/^#\s+/,''))+'</h2>';
  if(/^[-*]\s+/.test(l))return '<p class="bullet">'+esc(l.replace(/^[-*]\s+/,''))+'</p>';
  if(/^\|/.test(l))return '<p class="mono">'+esc(l)+'</p>';
  return l.trim()?'<p>'+esc(l)+'</p>':'';
 }).join('');
}
function cargarMemoria(){
 const estado=document.getElementById('memoriaEstado'),cuerpo=document.getElementById('memoriaCuerpo');if(!estado)return;
 estado.className='pill';estado.innerHTML='<i></i>Leyendo…';
 fetch('/_tdt/memoria',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(e=>{
  if(!document.getElementById('memoriaCuerpo'))return;
  estado.className='pill on';estado.innerHTML='<i></i>'+e.documentos.length+' fuentes locales';
  cuerpo.innerHTML=e.documentos.map(d=>'<button class="card memory-card" data-memory="'+d.id+'"><span class="memory-top"><h2>'+esc(d.nombre)+'</h2><span class="count">'+d.lineas+' líneas</span></span><p>'+esc(d.funcion)+'</p><footer><span>'+esc(d.archivo)+'</span><span>Abrir →</span></footer></button><section class="card memory-content" id="memory-'+d.id+'"><div class="doc-head"><strong>'+esc(d.nombre)+'</strong><span>'+esc(d.archivo)+'</span></div>'+memoryMarkup(d.contenido)+'</section>').join('');
 }).catch(()=>{estado.className='pill';estado.innerHTML='<i></i>No se pudo leer la memoria local';cuerpo.innerHTML=''});
}
const fsvg='<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
function cargarMapa(){
 const estado=document.getElementById('mapaEstado'),cuerpo=document.getElementById('mapaCuerpo');if(!estado)return;
 estado.className='pill';estado.innerHTML='<i></i>Leyendo…';
 fetch('/_tdt/estructura',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(e=>{
  if(!document.getElementById('mapaCuerpo'))return;
  estado.className='pill on';estado.innerHTML='<i></i>Leído '+new Date(e.actualizado).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false});
  const S=e.simple||{},orden=['SYSTEM','GLOBAL','GROWTH','DIGITAL','PERSONAL'];
  const dirs=e.carpetas.filter(c=>c.dir).sort((a,b)=>{const i=orden.indexOf(a.name),j=orden.indexOf(b.name);return (i<0?99:i)-(j<0?99:j)});
  const chev='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  const node=(nombre,texto,clase,plegable,n)=>{
   const inner=(plegable?chev:'')+fsvg+'<b>'+esc(nombre)+'</b>'+(n?'<span class="count">'+n+'</span>':'')+(texto?'<em>'+esc(texto)+'</em>':'');
   return plegable?'<button type="button" class="node '+(clase||'')+'" data-fold>'+inner+'</button>':'<span class="node '+(clase||'')+'">'+inner+'</span>';
  };
  const rama=c=>{const hijos=(c.children||[]).filter(h=>h.dir);
   return '<li>'+node(c.name,S[c.name],'top',hijos.length>0,hijos.length)+(hijos.length?'<ul>'+hijos.map(h=>'<li>'+node(h.name,S[c.name+'/'+h.name])+'</li>').join('')+'</ul>':'')+'</li>'};
  cuerpo.innerHTML='<section class="card tree"><ul><li>'+node('TDT','','root',true)+'<ul>'+dirs.map(rama).join('')+'</ul></li></ul></section>';
 }).catch(()=>{estado.className='pill';estado.innerHTML='<i></i>Sin conexión con el servidor local';cuerpo.innerHTML=''});
}

function render(next,detailId){
 const page=next||'inicio';
 document.querySelectorAll('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const title=detailId?DETAIL[detailId]?.title:(page in NAMES?NAMES[page]:(DETAIL[page]?.title||page));
 document.getElementById('crumb').innerHTML='System'+(title?' <span style="opacity:.4">/</span> <b>'+esc(title)+'</b>':'');
 document.body.classList.toggle('inicio',page==='inicio'&&!detailId);
 const app=document.getElementById('app');
 app.innerHTML=detailId?detail(detailId,'sistema'):page==='inicio'?home():page==='mapa'?mapa():page==='memoria'?memoryView():page==='global'?globalView():page==='growth'?growthView():page==='digital'?digitalView():page==='sistema'?architecture():detail(page);
 if(page==='mapa'&&!detailId)cargarMapa();
 if(page==='memoria'&&!detailId)cargarMemoria();
 app.style.animation='none';void app.offsetWidth;app.style.animation='';
 try{history.replaceState(null,'','#'+(detailId?'sistema/'+detailId:page))}catch{}
 window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
 if(e.target.closest('#mapaRefrescar')){cargarMapa();return}
 if(e.target.closest('#memoriaRefrescar')){cargarMemoria();return}
 const m=e.target.closest('[data-memory]');if(m){const panel=document.getElementById('memory-'+m.dataset.memory),was=panel.classList.contains('open');document.querySelectorAll('.memory-content.open').forEach(x=>x.classList.remove('open'));if(!was)panel.classList.add('open');return}
 const f=e.target.closest('[data-fold]');if(f){f.parentElement.classList.toggle('open');return}
 const d=e.target.closest('[data-detail]');if(d){render('sistema',d.dataset.detail);return}
 const p=e.target.closest('button[data-page]');if(p)render(p.dataset.page);
});

const route=location.hash.replace(/^#/,'').split('/');render(route[0]||'inicio',route[1]);
