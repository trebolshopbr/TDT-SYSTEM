<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #080B0F;
  --card: #0D1118;
  --line: #161D26;
  --line-2: #222C38;
  --text: #EDF0F4;
  --muted: #5A6470;
  --muted-2: #3A424C;
  --pend: #FBBF24;
  --exc: #F87171;
  --ok-c: #4ADE80;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body.intro { height: 100%; overflow: hidden; user-select: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Portada ---------- */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
.top { position: absolute; top: 0; left: 0; right: 0; padding: 28px 36px; z-index: 20; }
.top a { font: 400 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); transition: color .15s; }
.top a:hover { color: var(--text); }
.hero-intro { text-align: center; display: flex; flex-direction: column; align-items: center; }
.logo { display: block; width: clamp(280px, 48vw, 560px); max-width: 90vw; height: auto; color: var(--text); }
.unit-tag { margin-top: 14px; font: 600 clamp(22px, 4.2vw, 44px)/1 var(--sans); letter-spacing: .38em; text-transform: uppercase; padding-left: .38em; }
.door {
  margin-top: 56px; width: 76px; height: 76px; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--text);
  border: 1px solid var(--line-2);
  transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
}
.door svg { width: 30px; height: 30px; }
.door:hover { border-color: var(--text); background: rgba(237,240,244,.06); transform: translateY(-3px); box-shadow: 0 0 40px rgba(237,240,244,.06); }

/* ---------- App ---------- */
.app { display: none; }
body.loja .app { display: block; }
body.loja .stage { display: none; }
.bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 20px;
  padding: 12px clamp(16px, 4vw, 40px);
  background: rgba(0,0,0,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand svg { width: 46px; height: auto; }
.brand span { font: 600 11px/1 var(--sans); letter-spacing: .32em; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a {
  padding: 7px 11px; border-radius: 7px; font-size: 13px; color: var(--muted);
  transition: color .15s, background .15s;
}
.nav a:hover { color: var(--text); background: var(--card); }
.proto { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); border: 1px dashed var(--line-2); border-radius: 999px; padding: 5px 9px; flex-shrink: 0; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.view { padding-bottom: 80px; }
section.zone { padding: 64px 0 0; scroll-margin-top: 64px; }
.zone-head { display: grid; grid-template-columns: 200px 1fr; gap: 24px; margin-bottom: 24px; align-items: baseline; }
.label { font: 400 10px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; }
h1 { font-size: clamp(28px, 4.2vw, 50px); line-height: 1.05; }
h2 { font-size: clamp(18px, 2.2vw, 24px); line-height: 1.15; }
h3 { font-size: 13px; }
p { margin: 0; }
.muted { color: var(--muted); }
.pend { display: inline-flex; align-items: center; gap: 6px; font: 400 11px/1.4 var(--mono); color: var(--pend); border: 1px dashed rgba(251,191,36,.3); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.ok { display: inline-flex; align-items: center; gap: 6px; font: 400 11px/1.4 var(--mono); color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: currentColor; }
.panel { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-b { padding: 16px; }
.empty { padding: 22px; border: 1px dashed var(--line-2); border-radius: var(--radius); color: var(--muted); text-align: center; font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 8px; border: 1px solid var(--text); background: var(--text); color: #000; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .15s; }
.btn:hover { opacity: .88; transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--muted-2); opacity: 1; transform: none; }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--text); }

/* Tablas */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font: 400 10px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.table tr:last-child td { border-bottom: 0; }
.table td.r, .table th.r { text-align: right; }
.scroll-x { overflow-x: auto; }

/* Hero de operación: grid con fondo */
.op-hero {
  position: relative; padding: 72px 0 56px; border-bottom: 1px solid var(--line); overflow: hidden;
}
.op-hero::before {
  content: "";  position: absolute; inset: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
  opacity: .5; pointer-events: none;
}
.op-hero .inner { position: relative; display: grid; grid-template-columns: 1fr; gap: 28px; }
.op-hero p.lead { font-size: 16px; color: #8D98A6; max-width: 600px; line-height: 1.7; }
.route { margin-top: 12px; padding: 24px 16px 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.route svg { width: 100%; height: auto; display: block; }
.route .dash { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
.route-list { display: none; list-style: none; margin: 0; padding: 0; }
.route-list li { position: relative; padding: 7px 0 7px 26px; font-size: 14px; }
.route-list li::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--line-2); }
.route-list li:first-child::before { top: 50%; } .route-list li:last-child::before { bottom: 50%; }
.route-list li::after { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; border-radius: 50%; background: #000; border: 2px solid var(--text); }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .route .dash { animation: none; } }

/* Proceso */
.process { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.process div { padding: 16px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.process div:last-child { border-right: 0; }
.process small { font: 400 10px/1 var(--mono); color: var(--muted); }
.process b { font-size: 13px; font-weight: 600; }
.process span { font-size: 12px; color: var(--muted); }

/* Triple Frontera */
.tri { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
.map { padding: 0; overflow: hidden; }
.map svg { width: 100%; height: auto; display: block; }
.facts { display: flex; flex-direction: column; }
.facts div { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.facts div:last-child { border-bottom: 0; }

/* Mercados */
.markets { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* Formularios */
.two { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); grid-column: span 6; }
.field.s2 { grid-column: span 2; } .field.s3 { grid-column: span 3; } .field.s4 { grid-column: span 4; }
.field input, .field select, .field textarea { padding: 10px 12px; border-radius: 8px; outline: none; background: var(--card); border: 1px solid var(--line-2); min-width: 0; transition: border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--muted-2); }
.req::after { content: " *"; color: var(--text); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-2); font-size: 13px; cursor: pointer; color: var(--text); transition: border-color .15s, background .15s; }
.opt:has(input:checked) { border-color: var(--muted-2); background: var(--card); }
input[type=radio], input[type=checkbox] { accent-color: #fff; }
.sticky { position: sticky; top: 72px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.err { color: var(--exc); font-size: 13px; }

/* Operación */
.op-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
.phase { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 20px 0 8px; }
.phase div { font-size: 11px; color: var(--muted); padding-top: 10px; border-top: 3px solid var(--line-2); transition: border-color .2s; }
.phase div.done { color: var(--text); border-top-color: var(--text); }
.phase div.now { color: var(--text); border-top-color: var(--pend); }
.track { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); margin: 8px 0 4px; }
.track div { position: relative; padding-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
.track div::before { content: ""; position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: var(--line-2); }
.track div:first-child::before { left: 50%; } .track div:last-child::before { right: 50%; }
.track div::after { content: ""; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: #000; border: 2px solid var(--line-2); }
.track div.done { color: var(--text); }
.track div.done::before { background: var(--text); }
.track div.done::after { background: var(--text); border-color: var(--text); }
.track div.now::after { background: var(--pend); border-color: var(--pend); box-shadow: 0 0 0 5px rgba(251,191,36,.15); }
.track small { display: block; font: 400 10px/1.3 var(--mono); color: var(--muted); margin-top: 2px; }
.op-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.op-grid .wide { grid-column: span 2; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.events li:last-child { border-bottom: 0; }
.events li.exc { color: var(--exc); }
.pend-list { list-style: none; margin: 0; padding: 0; }
.pend-list li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.pend-list li:last-child { border-bottom: 0; }
.pend-list .dot { color: var(--pend); margin-top: 7px; flex-shrink: 0; }
.exc-box { border: 1px solid rgba(248,113,113,.35); background: rgba(248,113,113,.05); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.list { display: grid; gap: 8px; }
.list a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color .2s; }
.list a:hover { border-color: var(--line-2); }
.crumbs { font-size: 12px; color: var(--muted); padding-top: 22px; display: flex; gap: 8px; }
.crumbs a:hover { color: var(--text); }
.foot { border-top: 1px solid var(--line); margin-top: 64px; padding: 24px 0 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.foot a:hover { color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 18px; border-radius: 999px; background: var(--text); color: #000; font-size: 13px; font-weight: 600; transition: opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1); z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 980px) {
  .process { grid-template-columns: repeat(4, 1fr); }
  .process div:nth-child(4) { border-right: 0; }
  .process div:nth-child(-n+4) { border-bottom: 1px solid var(--line); }
  .tri, .markets, .two { grid-template-columns: 1fr; }
  .op-grid { grid-template-columns: 1fr 1fr; }
  .sticky { position: static; }
}
@media (max-width: 720px) {
  .route svg { display: none; }
  .route-list { display: block; }
  .nav { display: none; }
  .proto { margin-left: auto; }
  .zone-head { grid-template-columns: 1fr; gap: 8px; }
  .process { grid-template-columns: 1fr 1fr; }
  .process div { border-right: 0; border-bottom: 1px solid var(--line); }
  .phase { grid-template-columns: repeat(4, 1fr); row-gap: 12px; }
  .track { grid-template-columns: 1fr; gap: 0; }
  .track div { text-align: left; padding: 6px 0 6px 28px; }
  .track div::before { top: 0; bottom: 0; left: 7px; right: auto; width: 2px; height: auto; }
  .track div:first-child::before { top: 50%; left: 7px; } .track div:last-child::before { bottom: 50%; right: auto; }
  .track div::after { top: 50%; left: 1px; transform: translateY(-50%); }
  .op-grid { grid-template-columns: 1fr; }
  .op-grid .wide { grid-column: auto; }
  .fields .field.s2, .fields .field.s3, .fields .field.s4 { grid-column: span 6; }
  .facts div { grid-template-columns: 1fr; gap: 2px; }
  .events li { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>

// Sequência usada só para simular o avanço no protótipo.
const PASSOS = [

/* ---------- Operação ---------- */
function pendencias(op) {
  const p = [];
  DOCS.filter(d => !op.docs.includes(d) && ['Proforma invoice', 'Commercial invoice', 'Packing list'].includes(d)).forEach(d => p.push(`Enviar ${d}`));
  if (!op.fornecedor) p.push(op.temFornecedor === 'sim' ? 'Informar dados do fornecedor' : 'Definir fornecedor (sourcing)');
  if (!op.peso && !op.volume) p.push('Informar peso ou volume da carga');
  if (op.modal === 'Ainda não sei') p.push('Definir modal na análise');
  if (op.fase < 2) p.push('Cotar custos previstos');
  if (op.fase < 3) p.push('Atribuir responsável da Global');
  op.excecoes.filter(e => !e.resolvida).forEach(e => p.push('Resolver exceção: ' + e.txt));
  return p;
}

      <div class="kv"><span class="muted">Solicitação</span><span class="mono">${dia(op.data)}</span></div>
      <div class="kv"><span class="muted">Prazo desejado</span><span>${op.prazo ? `<span class="mono">${dia(op.prazo + 'T12:00:00')}</span>` : '—'}</span></div>
      <div class="kv"><span class="muted">ETD (saída)</span><span>${pend('a definir')}</span></div>
      <div class="kv"><span class="muted">ETA (chegada)</span><span>${pend('a definir')}</span></div>
    </div></div>

    <div class="panel wide"><div class="panel-h"><h3>Documentos</h3><span class="muted mono" style="font-size:12px">${op.docs.length} / ${DOCS.length} do cliente</span></div>
      <table class="table"><tbody>
        ${DOCS.map(d => `<tr><td>${d}</td><td class="r">${docStatus(d)}</td></tr>`).join('')}
        ${DOCS_OPERACAO.map(d => `<tr><td>${d.nome}</td><td class="r">${op.etapa >= d.etapa ? ok('emitido') : `<span class="muted" style="font-size:12px">na etapa ${ETAPAS[d.etapa]}</span>`}</td></tr>`).join('')}
      </tbody></table></div>

    <div class="panel"><div class="panel-h"><h3>Pendências</h3><span class="mono muted" style="font-size:12px">${pends.length}</span></div><div class="panel-b">
      ${pends.length ? `<ul class="pend-list">${pends.map(p => `<li><span class="dot"></span><span>${esc(p)}</span></li>`).join('')}</ul>` : '<p class="muted" style="font-size:13px">Nenhuma pendência.</p>'}
    </div></div>

    <div class="panel wide"><div class="panel-h"><h3>Custos</h3><span class="muted" style="font-size:12px">sem valores até a cotação</span></div>
      <div class="scroll-x"><table class="table"><thead><tr><th>Item</th><th class="r">Previsto</th><th class="r">Real</th></tr></thead><tbody>
        ${CUSTOS.map(c => `<tr><td>${c}</td><td class="r">${pend('a cotar')}</td><td class="r muted">—</td></tr>`).join('')}
        <tr><td><b>Total</b></td><td class="r">${pend('a cotar')}</td><td class="r muted">—</td></tr>
      </tbody></table></div></div>

    <div class="panel"><div class="panel-h"><h3>Responsáveis</h3></div><div class="panel-b">
      <div class="kv"><span class="muted">Cliente</span><span>${esc(op.contato)}</span></div>
      <div class="kv"><span class="muted">E-mail</span><span>${esc(op.email)}</span></div>
      <div class="kv"><span class="muted">Global</span><span>${op.fase >= 3 ? ok('atribuído') : pend('a atribuir')}</span></div>
      <div class="kv"><span class="muted">Despachante</span><span>${pend('a definir')}</span></div>
    </div></div>

    <div class="panel wide"><div class="panel-h"><h3>Eventos</h3><span class="mono muted" style="font-size:12px">${op.eventos.length}</span></div><div class="panel-b">
      <ul class="events">${[...op.eventos].reverse().map(e => `<li class="${e.exc ? 'exc' : ''}"><span class="mono muted">${quando(e.t)}</span><span>${esc(e.txt)}</span></li>`).join('')}</ul>
    </div></div>

    <div class="panel"><div class="panel-h"><h3>Exceções</h3><span class="mono muted" style="font-size:12px">${abertas.length} aberta(s)</span></div><div class="panel-b stack">
      ${op.excecoes.length ? op.excecoes.map((e, i) => `<div class="exc-box" style="${e.resolvida ? 'opacity:.55' : ''}"><b>${esc(e.txt)}</b><span class="muted">${quando(e.t)} · ${e.resolvida ? 'resolvida' : 'aberta'}</span>${e.resolvida ? '' : `<button class="link-btn" data-resolver="${op.numero}:${i}" style="align-self:flex-start">Marcar como resolvida</button>`}</div>`).join('')
        : '<p class="muted" style="font-size:13px">Sem exceções. Retenções, atrasos e divergências aparecem aqui com dono e prazo.</p>'}
    </div></div>

    <div class="panel wide"><div class="panel-h"><h3>Observações do cliente</h3></div><div class="panel-b"><p class="${op.obs ? '' : 'muted'}" style="font-size:13px">${op.obs ? esc(op.obs) : 'Sem observações.'}</p></div></div>
  </div>`;
}
function telaProposta(op) {
  if (!op) return `<div class="crumbs"><a href="#/acompanhar">Acompanhar</a></div><div class="empty" style="margin-top:20px">Operação não encontrada.</div>`;
  const volta = `<a href="#/operacao/${op.numero}">Operação #${op.numero}</a>`;
  if (op.fase < 2) return `<div class="crumbs">${volta}<span>/</span><span>Proposta</span></div><div class="empty" style="margin-top:20px">A proposta fica disponível depois da análise.</div>`;
  const aprovada = op.fase >= 3;
  return `<div class="crumbs">${volta}<span>/</span><span>Proposta</span></div>
  <div class="op-head">
    <div><span class="label">Proposta</span><h1 class="mono" style="margin-top:6px">Proposta #${op.numero}</h1>
      <p class="muted" style="margin-top:6px">${esc(op.origem)} → ${esc(op.destino)} · ${esc(op.empresa)}</p></div>
    ${aprovada ? ok('aprovada') : pend('aguardando sua aprovação')}
  </div>
  <div class="two" style="margin-top:20px">
    <div class="stack">
      <div class="panel"><div class="panel-h"><h3>Escopo</h3></div><div class="panel-b">
        <div class="kv"><span class="muted">Tipo de operação</span><span>${pend('a confirmar')}</span></div>
        <div class="kv"><span class="muted">Rota</span><span>${esc(op.origem)} → ${esc(op.destino)}</span></div>
        <div class="kv"><span class="muted">Carga</span><span class="mono">${esc(op.quantidade)} ${esc(op.unidade)} · ${esc(op.carga)}</span></div>
        <div class="kv"><span class="muted">Modal</span><span>${op.modal === 'Ainda não sei' ? pend('a definir') : esc(op.modal)}</span></div>
        <div class="kv"><span class="muted">Fornecedor</span><span>${op.fornecedor ? esc(op.fornecedor) : pend('sourcing a definir')}</span></div>
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Etapas incluídas</h3></div><div class="panel-b"><div class="track">${ETAPAS.map(e => `<div>${e}</div>`).join('')}</div></div></div>
      <div class="panel"><div class="panel-h"><h3>Custos previstos</h3><span class="muted" style="font-size:12px">sem valores até a cotação</span></div>
        <div class="scroll-x"><table class="table"><tbody>
          ${CUSTOS.map(c => `<tr><td>${c}</td><td class="r">${pend('a cotar')}</td></tr>`).join('')}
          <tr><td><b>Total previsto</b></td><td class="r">${pend('a cotar')}</td></tr>
        </tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h3>Documentos necessários</h3></div>
        <table class="table"><tbody>${DOCS.map(d => `<tr><td>${d}</td><td class="r">${op.docs.includes(d) ? ok('já informado') : pend('pendente')}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="panel sticky"><div class="panel-h"><h3>Condições</h3></div><div class="panel-b">
      <div class="kv"><span class="muted">Prazo desejado</span><span>${op.prazo ? `<span class="mono">${dia(op.prazo + 'T12:00:00')}</span>` : '—'}</span></div>
      <div class="kv"><span class="muted">ETD / ETA</span><span>${pend('a definir')}</span></div>
      <div class="kv"><span class="muted">Pagamento</span><span>${pend('a definir')}</span></div>
      <div class="kv"><span class="muted">Responsável Global</span><span>${pend('a atribuir')}</span></div>
      <div class="kv"><span class="muted">Validade</span><span>${pend('a definir')}</span></div>
      ${aprovada ? `<a class="btn" href="#/operacao/${op.numero}" style="width:100%;margin-top:14px">Ir para a operação</a>`
        : `<button class="btn" data-aprovar="${op.numero}" style="width:100%;margin-top:14px">Aprovar proposta</button>
           <form id="ajusteForm" data-num="${op.numero}" style="margin-top:12px" class="stack">
             <label class="field">Pedir ajuste<textarea name="txt" rows="2" placeholder="O que precisa mudar?"></textarea></label>
             <button class="btn ghost" type="submit">Enviar ajuste</button>
           </form>`}
      <p class="muted" style="font-size:12px;margin-top:10px;text-align:center">Protótipo: nada é enviado.</p>
    </div></div>
  </div>`;
}

function telaAcompanhar() {
  return `<div class="crumbs"><a href="#/imports">Imports</a><span>/</span><span>Acompanhar</span></div>
  <div style="padding:14px 0 22px"><span class="label">Seguimento para cliente</span><h1 style="margin-top:8px">Minhas operações</h1></div>
  ${buscaOperacao()}
  <div style="margin-top:20px">${operacoes.length
    ? `<div class="list">${[...operacoes].reverse().map(o => `<a href="#/operacao/${o.numero}"><span><b class="mono">#${o.numero}</b><br><span class="muted">${esc(o.origem)} → ${esc(o.destino)} · ${esc(o.carga)}</span></span><span style="text-align:right"><span class="ok">${FASES[o.fase]}</span><br><span class="muted mono" style="font-size:12px">${dia(o.data)}</span></span></a>`).join('')}</div>`
    : '<div class="empty">Nenhuma operação ainda. <a href="#/solicitar" style="text-decoration:underline">Estruturar operação</a></div>'}</div>`;
}

/* ---------- Navegação interna ----------
   A rota vive aqui. O endereço do navegador (#...) é atualizado quando dá; se a página
   for aberta como arquivo solto (data:, file:), o navegador bloqueia isso e a navegação segue igual. */
let rotaInterna = location.hash || '#/';
const hashAtual = () => rotaInterna;
function ir(h) {
  rotaInterna = h;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch {}
  render();
}
const sincronizar = () => { rotaInterna = location.hash || '#/'; render(); };
window.addEventListener('hashchange', sincronizar);
window.addEventListener('popstate', sincronizar);
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.target.closest('button')) return;
  e.preventDefault(); ir(a.getAttribute('href'));
}, true);

/* ---------- Roteador ---------- */
let recem = null;
function render() {
  const [rota, query] = hashAtual().slice(1).split('?');
  const partes = rota.split('/').filter(Boolean), params = new URLSearchParams(query || '');
  const intro = !partes.length;
  document.body.classList.toggle('intro', intro);
  document.body.classList.toggle('loja', !intro);
  if (intro) return;
  const [tela, a] = partes, view = document.getElementById('view');
  if (tela === 'solicitar') view.innerHTML = telaSolicitar();
  else if (tela === 'operacao') view.innerHTML = telaOperacao(operacoes.find(o => o.numero === a), recem === a);
  else if (tela === 'proposta') view.innerHTML = telaProposta(operacoes.find(o => o.numero === a));
  else if (tela === 'acompanhar') view.innerHTML = telaAcompanhar();
  else view.innerHTML = telaImports();
  resumoSolicitacao();
  const alvo = params.get('s') && document.getElementById(params.get('s'));
  if (alvo) alvo.scrollIntoView(); else window.scrollTo(0, 0);
}

/* ---------- Ações ---------- */
document.addEventListener('input', e => { if (e.target.closest('#solicitacao')) resumoSolicitacao(); });
document.addEventListener('change', e => { if (e.target.closest('#solicitacao')) resumoSolicitacao(); });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const busca = n => operacoes.find(o => o.numero === n);
  if (t.dataset.avancar) {
    const op = busca(t.dataset.avancar), p = PASSOS[op.passo];
    op.fase = p.fase; op.etapa = p.etapa; op.passo++;
    op.eventos.push({ t: new Date().toISOString(), txt: p.ev, etapa: p.etapa >= 0 && !op.eventos.some(x => x.etapa === p.etapa) ? p.etapa : undefined });
    salvar(); render(); toast(p.ev);
  }
  if (t.dataset.aprovar) {
    const op = busca(t.dataset.aprovar), p = PASSOS[2];
    op.fase = p.fase; op.etapa = p.etapa; op.passo = 3;
    op.eventos.push({ t: new Date().toISOString(), txt: 'Proposta aprovada pelo cliente · operação aberta' });
    salvar(); ir('#/operacao/' + op.numero); toast('Proposta aprovada');
  }
  if (t.dataset.excecao) {
    const op = busca(t.dataset.excecao), onde = op.etapa >= 0 ? ETAPAS[op.etapa] : FASES[op.fase];
    const txt = `Exceção simulada em ${onde}: conferência documental adicional`;
    op.excecoes.push({ t: new Date().toISOString(), txt, resolvida: false });
    op.eventos.push({ t: new Date().toISOString(), txt, exc: true });
    salvar(); render();
  }
  if (t.dataset.resolver) {
    const [n, i] = t.dataset.resolver.split(':'), op = busca(n);
    op.excecoes[i].resolvida = true;
    op.eventos.push({ t: new Date().toISOString(), txt: 'Exceção resolvida' });
    salvar(); render();
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'buscaOp') {
    const n = f.n.value.trim().toUpperCase().replace(/^#/, ''), err = document.getElementById('buscaErr');
    if (operacoes.some(o => o.numero === n)) ir('#/operacao/' + n);
    else { err.hidden = false; err.textContent = n ? `Não encontramos a operação ${n} neste navegador.` : 'Digite o número da operação.'; }
  }
  if (f.id === 'ajusteForm') {
    const txt = f.txt.value.trim(); if (!txt) { f.txt.focus(); return; }
    const op = operacoes.find(o => o.numero === f.dataset.num);
    op.eventos.push({ t: new Date().toISOString(), txt: 'Cliente pediu ajuste na proposta: ' + txt });
    salvar(); ir('#/operacao/' + op.numero); toast('Ajuste enviado');
  }
  if (f.id === 'solicitacao') {
    const err = document.getElementById('solErr');
    const falta = [...f.querySelectorAll('[required]')].filter(i => !i.value.trim() || (i.name === 'destino' && i.value.trim() === 'Brasil,'));
    if (falta.length) { err.hidden = false; err.textContent = 'Preencha origem, destino, carga, quantidade e os dados da empresa.'; falta[0].focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(f.email.value.trim())) { err.hidden = false; err.textContent = 'Confira o e-mail.'; f.email.focus(); return; }
    const numero = 'IMP-' + String(operacoes.length + 1).padStart(4, '0'), agora = new Date().toISOString();
    operacoes.push({
      numero, data: agora, fase: 0, etapa: -1, passo: 0,
      origem: f.origem.value.trim(), destino: f.destino.value.trim(), carga: f.carga.value.trim(),
      quantidade: f.quantidade.value, unidade: f.unidade.value, peso: f.peso.value, volume: f.volume.value,
      temFornecedor: f.temFornecedor.value, fornecedor: f.temFornecedor.value === 'sim' ? f.fornecedor.value.trim() : '',
      modal: f.modal.value, prazo: f.prazo.value, urgencia: f.urgencia.value,
      docs: [...f.querySelectorAll('[name=docs]:checked')].map(i => i.value), obs: f.obs.value.trim(),
      empresa: f.empresa.value.trim(), contato: f.contato.value.trim(), email: f.email.value.trim(),
      eventos: [{ t: agora, txt: 'Solicitação recebida · necessidade registrada' }], excecoes: []
    });
    salvar(); recem = numero; ir('#/operacao/' + numero);
  }
});
render();
</script>
</body>
</html>
