<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDT GLOBAL</title>
<link rel="icon" href="marca/tdt-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --field: #0E0E0E;
  --line-2: #2E2E2E;
  --text: #F2F2F2;
  --muted: #8A8A8A;
  --dim: #555555;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  position: relative;
  user-select: none;
}
a { color: inherit; text-decoration: none; }
button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--text); outline-offset: 4px; }

/* Escenografía Limpia */
.stage {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
}

/* Header */
.top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 28px 36px;
  z-index: 20;
}
.top a {
  font: 400 11px/1 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.15s;
}
.top a:hover { color: var(--text); }

/* Logo Lockup TDT GLOBAL */
.hero {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.logo-lockup {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo {
  display: block;
  width: clamp(280px, 48vw, 560px);
  max-width: 90vw;
  height: auto;
  color: var(--text);
}
.unit-tag {
  margin-top: 14px;
  font: 600 clamp(22px, 4.2vw, 44px)/1 var(--sans);
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--text);
  padding-left: 0.38em; /* óptico para centrado exacto */
}

.options-nav {
  margin-top: 36px;
  width: 100%;
  max-width: 220px;
}
.options-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  border-radius: 6px;
  color: var(--muted);
  font: 500 15px/1.3 var(--sans);
  letter-spacing: -0.01em;
  transition: color 0.15s, transform 0.15s, background 0.15s;
  text-decoration: none;
}
.opt:hover, .opt:focus-visible {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
  transform: translateX(4px);
}
.opt .arrow {
  color: var(--dim);
  font-family: var(--mono);
  font-size: 14px;
  transition: color 0.15s, transform 0.15s;
}
.opt:hover .arrow, .opt:focus-visible .arrow {
  color: #fff;
  transform: translateX(2px);
}
.opt .label {
  color: var(--text);
  font-weight: 500;
  letter-spacing: -0.01em;
}
.opt.opt-login:hover {
  background: rgba(255, 255, 255, 0.07);
}
</style>

<div class="stage">
  <header class="top">
    <a href="/">← TDT</a>
  </header>

  <main class="hero">
    <div class="logo-lockup">
      <svg class="logo" viewBox="0 0 830 259" fill="currentColor" role="img" aria-label="TDT">
        <path d="M0 0H270V52H0Z"/>
        <path d="M108 52L162 89V259H108Z"/>
        <path d="M291 0H460A100 100 0 0 1 560 100V158A100 100 0 0 1 460 258H291V89H347V201H457A44 44 0 0 0 501 157V96A44 44 0 0 0 457 52H291Z"/>
        <path d="M538 0H830V52H578A127 127 0 0 0 538 0Z"/>
        <path d="M669 52L723 89V259H669Z"/>
      </svg>
      <div class="unit-tag">GLOBAL</div>
    </div>

    <nav class="options-nav" aria-label="Accesos Global">
      <ul class="options-list">
        <li>
          <a class="opt" href="shop.html">
            <span class="arrow">→</span>
            <span class="label">Shop</span>
          </a>
        </li>
        <li>
          <a class="opt" href="atacado.html">
            <span class="arrow">→</span>
            <span class="label">Atacado</span>
          </a>
        </li>
        <li>
          <a class="opt" href="imports.html">
            <span class="arrow">→</span>
            <span class="label">Imports</span>
          </a>
        </li>
        <li>
          <a class="opt opt-login" id="loginGlobal" href="https://global.tdt.systems/login">
            <span class="arrow">→</span>
            <span class="label">Login</span>
          </a>
        </li>
      </ul>
    </nav>
    <script>
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      document.getElementById('loginGlobal').href = 'http://localhost:3000/login';
    }
    </script>
  </main>
</div>
