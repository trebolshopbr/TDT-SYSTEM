<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDT GLOBAL · Atacado</title>
<link rel="icon" href="marca/tdt-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #0A0A0A;
  --card: #111;
  --line: #1A1A1A;
  --line-2: #262626;
  --text: #F4F3EF;
  --muted: #5A5A5A;
  --muted-2: #3A3A3A;
  --photo: #EEECEA;
  --ok: #4ADE80;
  --vol: #E8E650;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body.intro { height: 100%; overflow: hidden; user-select: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
img { display: block; max-width: 100%; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Portada ---------- */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
.top { position: absolute; top: 0; left: 0; right: 0; padding: 28px 36px; z-index: 20; }
.top a { font: 400 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); transition: color .15s; }
.top a:hover { color: var(--text); }
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; }
.logo-lockup { display: flex; flex-direction: column; align-items: center; }
.logo { display: block; width: clamp(280px, 48vw, 560px); max-width: 90vw; height: auto; color: var(--text); }
.unit-tag { margin-top: 14px; font: 600 clamp(22px, 4.2vw, 44px)/1 var(--sans); letter-spacing: .38em; text-transform: uppercase; padding-left: .38em; }
.door {
  margin-top: 56px; width: 76px; height: 76px; border-radius: 50%;
  display: grid; place-items: center; background: var(--text); color: #000;
  border: 1px solid var(--text);
  transition: background .2s, transform .2s, box-shadow .2s;
}
.door svg { width: 30px; height: 30px; }
.door:hover { background: #dddbd5; transform: translateY(-3px); box-shadow: 0 12px 40px rgba(244,243,239,.12); }

/* ---------- App ---------- */
.app { display: none; }
body.loja .app { display: block; }
body.loja .stage { display: none; }
.fixa { position: sticky; top: 0; z-index: 30; }
.bar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px clamp(16px, 4vw, 40px);
  background: rgba(0,0,0,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand svg { width: 46px; height: auto; }
.brand span { font: 600 11px/1 var(--sans); letter-spacing: .32em; }
.search { flex: 1; display: flex; max-width: 440px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.search input { flex: 1; min-width: 0; padding: 8px 14px; background: transparent; border: none; outline: none; font-size: 14px; }
.search button { padding: 0 13px; border: none; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); transition: color .15s; }
.search button:hover { color: var(--text); }
.search svg { width: 15px; height: 15px; }
.bar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.perfil-pill { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); transition: color .15s, border-color .15s; }
.perfil-pill:hover { color: var(--text); border-color: var(--muted-2); }
.icon-btn { position: relative; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; border: 1px solid transparent; transition: border-color .15s, background .15s; }
.icon-btn:hover { border-color: var(--line-2); background: var(--surface); }
.icon-btn svg { width: 18px; height: 18px; }
.badge { position: absolute; top: 1px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--text); color: #000; font: 600 10px/17px var(--sans); text-align: center; animation: badgePop .25s cubic-bezier(.34,1.56,.64,1); }
@keyframes badgePop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.proto { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); border: 1px dashed var(--line-2); border-radius: 999px; padding: 5px 9px; }
.volume-strip { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 9px 16px; background: var(--vol); color: #000; font-size: 13px; }
.volume-strip b { font-weight: 700; }
.volume-strip a { padding: 5px 12px; border-radius: 6px; background: #000; color: var(--vol); font-weight: 600; font-size: 12px; transition: opacity .15s; }
.volume-strip a:hover { opacity: .85; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.view { padding-top: 24px; padding-bottom: 80px; }
section.block { margin-top: 44px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.02em; }
h1 { font-size: clamp(22px, 3vw, 34px); line-height: 1.1; }
h2 { font-size: 16px; }
h3 { font-size: 13px; }
.more { font-size: 12px; color: var(--muted); }
.more:hover { color: var(--text); }
.muted { color: var(--muted); }
.eyebrow { font: 400 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pend { display: inline-flex; align-items: center; font: 400 11px/1.4 var(--mono); color: var(--muted); border: 1px dashed var(--line-2); border-radius: 6px; padding: 3px 7px; }
.panel { padding: 18px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); }
.empty { padding: 22px; border-radius: var(--radius); border: 1px dashed var(--line-2); color: var(--muted); text-align: center; font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--text); background: var(--text); color: #000; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity .15s, transform .15s; }
.btn:hover { opacity: .88; transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--muted-2); opacity: 1; transform: none; }
.btn.full { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--text); }
.ident h1 { margin-bottom: 6px; }
.entradas { display: grid; grid-template-columns: 3fr 1fr; gap: 10px; margin-top: 20px; }
.entradas .label { display: block; font: 400 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.perfis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.entradas > div:last-child .perfil { height: calc(100% - 18px); }
.perfil { display: flex; flex-direction: column; gap: 10px; padding: 16px; min-height: 128px; text-align: left; border-radius: var(--radius-lg); background: var(--card); border: 1px solid var(--line-2); cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.perfil:hover { border-color: var(--muted-2); transform: translateY(-2px); }
.perfil.on { background: var(--text); color: #000; border-color: var(--text); }
.perfil.on .muted { color: #555; }
.perfil svg { width: 20px; height: 20px; }
.perfil b { font-size: 14px; font-weight: 600; }
.perfil span { font-size: 12px; }
.terms { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; margin-top: 18px; }
.terms div { background: var(--surface); padding: 13px 15px; display: flex; flex-direction: column; gap: 6px; }
.terms small { font: 400 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.acard { display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--card); border: 1px solid var(--line); overflow: hidden; transition: border-color .2s, box-shadow .2s; }
.acard:hover { border-color: var(--line-2); box-shadow: 0 8px 32px rgba(0,0,0,.5); }
.acard .top-row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 14px; }
.acard .ph { width: 92px; height: 92px; border-radius: 10px; background: var(--photo); display: grid; place-items: center; padding: 8px; }
.acard .ph img, .th img, .pdp-pic img { mix-blend-mode: multiply; object-fit: contain; max-height: 100%; }
.acard .nm { font-weight: 500; font-size: 13px; line-height: 1.3; }
.acard .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
.acard .price { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.acard .price b { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.kv { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.kv div { padding: 9px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; border-bottom: 1px solid var(--line); }
.kv div:nth-child(odd) { border-right: 1px solid var(--line); }
.kv small { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tiers { width: 100%; border-collapse: collapse; font-size: 12px; }
.tiers th, .tiers td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.tiers th { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.tiers td:last-child, .tiers th:last-child { text-align: right; }
.tiers td[colspan] { text-align: left; }
.acard .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 14px; margin-top: auto; }
.acard .actions .btn { padding: 9px 12px; font-size: 12px; }
.signal { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; }
.signal i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }
.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.cat { display: grid; grid-template-columns: 68px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); transition: border-color .2s; }
.cat:hover { border-color: var(--line-2); }
.th { width: 68px; height: 68px; border-radius: 9px; background: var(--photo); display: grid; place-items: center; padding: 6px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.table th, .table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; background: var(--card); }
.table tr:last-child td { border-bottom: 0; }
.table .th { width: 42px; height: 42px; }
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); }
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 22px; }
.crumbs a:hover { color: var(--text); }
.pdp { display: grid; grid-template-columns: 300px 1fr 320px; grid-template-areas: "pic info buy"; gap: 20px; align-items: start; }
.pdp > :nth-child(1) { grid-area: pic; } .pdp > :nth-child(2) { grid-area: info; } .pdp > :nth-child(3) { grid-area: buy; }
.pdp-pic { aspect-ratio: 1; border-radius: var(--radius-lg); background: var(--photo); display: grid; place-items: center; padding: 28px; overflow: hidden; }
.pdp-pic img { transition: transform .5s cubic-bezier(.25,.8,.25,1); }
.pdp-pic:hover img { transform: scale(1.05); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.qty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { padding: 10px 12px; border-radius: 8px; outline: none; background: var(--card); border: 1px solid var(--line-2); min-width: 0; transition: border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--muted-2); }
.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { padding: 8px 12px; background: transparent; border: 0; cursor: pointer; font-size: 12px; transition: background .15s; }
.seg button.on { background: var(--text); color: #000; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.r { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.r.t { font-size: 15px; font-weight: 700; padding-top: 10px; border-top: 1px solid var(--line); }
.cta-volume { padding: 16px; border-radius: var(--radius-lg); background: var(--vol); color: #000; display: flex; flex-direction: column; gap: 8px; }
.cta-volume b { font-weight: 700; }
.cta-volume .btn { background: #000; color: var(--vol); border-color: #000; font-weight: 700; }
.sticky.vol .cta-volume { order: -1; }
.two { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
.sticky { position: sticky; top: 110px; display: flex; flex-direction: column; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.fields .field { grid-column: span 6; }
.fields .s2 { grid-column: span 2; } .fields .s3 { grid-column: span 3; } .fields .s4 { grid-column: span 4; }
.step h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.step h3 i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.pick label { display: grid; grid-template-columns: auto 44px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 8px; border: 1px solid var(--line-2); cursor: pointer; font-size: 13px; transition: border-color .15s; }
.pick label:has(input:checked) { border-color: var(--muted-2); }
.pick .th { width: 44px; height: 44px; }
input[type=checkbox], input[type=radio] { accent-color: #fff; }
.vol-row { display: grid; grid-template-columns: 1fr 140px 160px; gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vol-row:last-child { border-bottom: 0; }
.err { color: #f87171; font-size: 13px; }
.track { display: grid; grid-template-columns: repeat(4, 1fr); margin: 6px 0; }
.track div { position: relative; padding-top: 20px; font-size: 12px; color: var(--muted); }
.track div::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 2px; background: var(--line); }
.track div::after { content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: #000; border: 2px solid var(--line); }
.track div.done { color: var(--text); }
.track div.done::before, .track div.done::after { background: var(--text); border-color: var(--text); }
.list { display: grid; gap: 8px; }
.list a { display: flex; justify-content: space-between; gap: 16px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); transition: border-color .2s; }
.list a:hover { border-color: var(--line-2); }
.foot { border-top: 1px solid var(--line); padding: 24px 0 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.foot a:hover { color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 18px; border-radius: 999px; background: var(--text); color: #000; font-size: 13px; font-weight: 600; transition: opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1); z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1080px) { .pdp { grid-template-columns: 240px 1fr; grid-template-areas: "pic buy" "info info"; } }
@media (max-width: 860px) {
  .entradas { grid-template-columns: 1fr; }
  .perfis { grid-template-columns: 1fr 1fr; }
  .entradas > div:last-child .perfil { height: auto; }
  .terms { grid-template-columns: 1fr 1fr; }
  .pdp, .two { grid-template-columns: 1fr; }
  .pdp { grid-template-areas: "pic" "buy" "info"; }
  .pdp-pic { max-width: 300px; }
  .sticky { position: static; }
  .bar { flex-wrap: wrap; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .proto, .perfil-pill { display: none; }
  .volume-strip { flex-wrap: nowrap; gap: 10px; padding: 8px 12px; font-size: 12px; }
  .volume-strip a { padding: 5px 10px; white-space: nowrap; }
  .bar { padding-top: 8px; padding-bottom: 8px; row-gap: 8px; }
  .vol-row { grid-template-columns: 1fr 1fr; }
  .vol-row > :first-child { grid-column: 1 / -1; }
  .fields .s2, .fields .s3, .fields .s4 { grid-column: span 6; }
}
</style>
</head>

<div class="app">
  <div class="fixa">
  <header class="bar">
    <a class="brand" href="#/atacado" aria-label="TDT Atacado">
      <svg viewBox="0 0 830 259" fill="currentColor" aria-hidden="true"><path d="M0 0H270V52H0Z"/><path d="M108 52L162 89V259H108Z"/><path d="M291 0H460A100 100 0 0 1 560 100V158A100 100 0 0 1 460 258H291V89H347V201H457A44 44 0 0 0 501 157V96A44 44 0 0 0 457 52H291Z"/><path d="M538 0H830V52H578A127 127 0 0 0 538 0Z"/><path d="M669 52L723 89V259H669Z"/></svg>

    </a>

      <input name="q" type="search" placeholder="Buscar produtos para revender" aria-label="Buscar produtos">

    </form>

      <span class="proto">Protótipo</span>

      <a class="icon-btn" href="#/conta" aria-label="Minha conta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>

      <a class="icon-btn" href="#/pedido" aria-label="Pedido">

  document.getElementById('pUn').innerHTML = pu ? `<span class="num">${brl(pu)}</span>` : pend('a confirmar');

          <td>${p.unidadesPorCaixa ? `<span class="num">${Math.ceil(q / p.unidadesPorCaixa)} cx</span>` : pend('a definir')}</td>
          <td>${pu ? `<span class="num">${brl(pu)}</span>` : pend('a confirmar')}</td>
          <td>${pu ? `<span class="num">${brl(pu * q)}</span>` : pend('a confirmar')}</td>
          <td><button type="button" class="link-btn" data-rm="${p.id}">Remover</button></td>
        </tr>`; }).join('')}
      </tbody></table></div>

      <div class="panel step"><h3><i>1</i>Dados da empresa</h3>
        <div class="fields">
          <label class="field s3">CNPJ<input name="cnpj" required inputmode="numeric" maxlength="18" class="num"></label>
          <label class="field s3">Razão social<input name="razao" required></label>
          <label class="field s3">Contato<input name="contato" required autocomplete="name"></label>
          <label class="field s3">E-mail<input name="email" type="email" required autocomplete="email"></label>
        </div>
      </div>
      <div class="panel step"><h3><i>2</i>Entrega</h3>
        <div class="fields">
          <label class="field s2">CEP<input name="cep" required inputmode="numeric" maxlength="9" class="num"></label>
          <label class="field s3">Cidade<input name="cidade" required></label>
          <label class="field s2" style="grid-column:span 1">UF<input name="uf" required maxlength="2"></label>
        </div>
        <p class="muted" style="font-size:12px;margin:10px 0 0">Frete e prazo: ${pend('a confirmar com o pedido')}</p>
      </div>
      <div class="panel step"><h3><i>3</i>Condições</h3>${termos()}
        <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px"><input type="checkbox" name="aceite" required style="margin-top:3px"><span>Entendo que o pedido fica sujeito à confirmação de preço, estoque e condições antes do faturamento.</span></label>
      </div>
    </div>
    <div class="panel sticky">
      <h3>Resumo</h3>
      <div class="r"><span class="muted">Produtos</span><span class="num">${itens.length}</span></div>
      <div class="r"><span class="muted">Unidades</span><span class="num">${unidades}</span></div>
      <div class="r"><span class="muted">Pedido mínimo</span><span>${CONDICOES.pedidoMinimo ? esc(CONDICOES.pedidoMinimo) : pend('a definir')}</span></div>
      <div class="r"><span class="muted">Frete</span><span>${pend('a confirmar')}</span></div>
      <div class="r t"><span>Total</span><span>${semPreco ? pend('a confirmar') : `<span class="num">${brl(total)}</span>`}</span></div>
      <p class="err" id="pedidoErr" hidden></p>
      <button class="btn full" type="submit">${semPreco ? 'Enviar pedido para confirmação' : 'Enviar pedido'}</button>
      <span class="muted" style="font-size:12px;text-align:center">Protótipo: nada é enviado nem cobrado.</span>
    </div>
  </form>`;
}

function telaProposta(pre) {
  const escolhidos = pre ? [pre] : [];
  return `<div class="crumbs"><a href="#/atacado">Atacado</a><span>/</span><span>Grandes volumes</span></div>
  <span class="eyebrow">Grandes volumes / empresas</span>
  <h1 style="margin:8px 0 18px">Solicitar condição comercial</h1>
  <form class="two" id="propostaForm" novalidate>
    <div class="stack">
      <div class="panel step"><h3><i>1</i>Produtos de interesse</h3>
        <div class="pick">${PRODUTOS.map(p => `<label><input type="checkbox" name="prod" value="${p.id}" ${escolhidos.includes(p.id) ? 'checked' : ''}><span class="th"><img src="${p.foto}" alt=""></span><span>${esc(p.nome)}</span></label>`).join('')}</div>
        <label class="field" style="margin-top:10px">Outro produto que você procura (opcional)<input name="outro" placeholder="Descreva o produto"></label>
      </div>
      <div class="panel step"><h3><i>2</i>Volume</h3>
        <div id="volumes"></div>
      </div>
      <div class="panel step"><h3><i>3</i>Condição comercial desejada</h3>
        <div class="fields">
          <label class="field s3">Forma de pagamento<select name="pagto"><option>A combinar</option><option>À vista</option><option>Faturado (prazo)</option></select></label>
          <label class="field s3">Prazo de entrega desejado<select name="prazo"><option>A combinar</option><option>Até 15 dias</option><option>Até 30 dias</option><option>Mais de 30 dias</option></select></label>
          <label class="field">Observações<textarea name="obs" rows="3" placeholder="Destino, embalagem, marca, frequência…"></textarea></label>
        </div>
      </div>
      <div class="panel step"><h3><i>4</i>Empresa</h3>
        <div class="fields">
          <label class="field s3">CNPJ<input name="cnpj" required inputmode="numeric" maxlength="18" class="num"></label>
          <label class="field s3">Razão social<input name="razao" required></label>
          <label class="field s2">Contato<input name="contato" required autocomplete="name"></label>
          <label class="field s2">E-mail<input name="email" type="email" required autocomplete="email"></label>
          <label class="field s2">Telefone<input name="tel" required inputmode="tel" autocomplete="tel"></label>
          <label class="field s2">UF de entrega<input name="uf" required maxlength="2"></label>
        </div>
      </div>
    </div>
    <div class="panel sticky">
      <h3>Sua solicitação</h3>
      <div class="r"><span class="muted">Produtos</span><span class="num" id="sProd">0</span></div>
      <div class="r"><span class="muted">Unidades por pedido</span><span class="num" id="sUn">0</span></div>
      <div class="r"><span class="muted">Prazo de resposta</span><span>${pend('a definir')}</span></div>
      <p class="err" id="propErr" hidden></p>
      <button class="btn full" type="submit">Enviar solicitação</button>
      <span class="muted" style="font-size:12px;text-align:center">Protótipo: nada é enviado.</span>
    </div>
  </form>`;
}
function desenharVolumes() {
  const f = document.getElementById('propostaForm'); if (!f) return;
  const box = document.getElementById('volumes'), antes = {};
  box.querySelectorAll('[data-vol]').forEach(i => antes[i.dataset.vol + i.name] = i.value);
  const ids = [...f.querySelectorAll('[name=prod]:checked')].map(i => i.value);
  box.innerHTML = ids.length ? ids.map(id => `<div class="vol-row"><b>${esc(acha(id).nome)}</b>
    <label class="field">Unidades<input data-vol="${id}" name="q" type="number" min="1" class="num" value="${antes[id + 'q'] || ''}"></label>
    <label class="field">Frequência<select data-vol="${id}" name="freq">${['Compra única', 'Mensal', 'Trimestral'].map(o => `<option ${antes[id + 'freq'] === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label></div>`).join('')
    : '<p class="muted" style="margin:0;font-size:13px">Selecione os produtos para informar o volume.</p>';
  resumoProposta();
}
function resumoProposta() {
  const f = document.getElementById('propostaForm'); if (!f) return;
  document.getElementById('sProd').textContent = f.querySelectorAll('[name=prod]:checked').length;
  document.getElementById('sUn').textContent = [...f.querySelectorAll('[data-vol][name=q]')].reduce((a, i) => a + (Number(i.value) || 0), 0);
}

function telaDetalhe(tipo, reg, novo) {
  if (!reg) return '<div class="empty">Não encontrado. <a href="#/conta" style="text-decoration:underline">Minha conta</a></div>';
  const etapas = tipo === 'pedido' ? STATUS_PEDIDO : STATUS_PROPOSTA;
  return `<div class="crumbs"><a href="#/conta">Minha conta</a><span>/</span><span class="num">${reg.numero}</span></div>
  <h1 style="margin-bottom:4px">${novo ? (tipo === 'pedido' ? 'Pedido enviado' : 'Solicitação enviada') : (tipo === 'pedido' ? 'Pedido ' : 'Proposta ') + reg.numero}</h1>
  <p class="muted" style="margin:0 0 18px"><span class="num">${reg.numero}</span> · ${dataBR(reg.data)} · ${esc(reg.razao)}</p>
  <div class="two">
    <div class="stack">
      <div class="panel"><h3 style="margin-bottom:12px">Acompanhamento</h3>
        <div class="track">${etapas.map((s, i) => `<div class="${i <= reg.status ? 'done' : ''}">${s}</div>`).join('')}</div>
        ${reg.status < 3 ? `<button class="link-btn" data-avancar="${tipo}:${reg.numero}" style="margin-top:12px">Simular próximo status (protótipo)</button>` : ''}
      </div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Unidades</th>${tipo === 'proposta' ? '<th>Frequência</th>' : '<th>Preço / un.</th>'}</tr></thead><tbody>
        ${reg.itens.map(i => `<tr><td>${esc(acha(i.id).nome)}</td><td class="num">${i.q}</td><td>${tipo === 'proposta' ? esc(i.freq) : pend('a confirmar')}</td></tr>`).join('')}
        ${reg.outro ? `<tr><td colspan="3">Outro: ${esc(reg.outro)}</td></tr>` : ''}
      </tbody></table></div>
    </div>
    <div class="panel sticky">
      <h3>${tipo === 'pedido' ? 'Resumo' : 'Condição pedida'}</h3>
      ${tipo === 'pedido'
        ? `<div class="r"><span class="muted">Unidades</span><span class="num">${reg.itens.reduce((a, i) => a + i.q, 0)}</span></div><div class="r"><span class="muted">Entrega</span><span>${esc(reg.cidade)}/${esc(reg.uf)}</span></div><div class="r t"><span>Total</span><span>${pend('a confirmar')}</span></div><button class="btn full" data-repetir="${reg.numero}">Repetir pedido</button>`
        : `<div class="r"><span class="muted">Pagamento</span><span>${esc(reg.pagto)}</span></div><div class="r"><span class="muted">Prazo</span><span>${esc(reg.prazo)}</span></div><div class="r"><span class="muted">Resposta</span><span>${pend('prazo a definir')}</span></div>`}
      <a class="more" href="#/atacado" style="text-align:center">Voltar ao atacado</a>
    </div>
  </div>`;
}

function telaConta() {
  return `<h1 style="margin-bottom:18px">Minha conta</h1>
  <section><div class="head"><h2>Pedidos de atacado</h2></div>
    ${pedidos.length ? `<div class="list">${[...pedidos].reverse().map(x => `<a href="#/ver/pedido/${x.numero}"><span><b class="num">${x.numero}</b><br><span class="muted">${dataBR(x.data)} · <span class="num">${x.itens.reduce((a, i) => a + i.q, 0)}</span> un.</span></span><span class="muted">${STATUS_PEDIDO[x.status]}</span></a>`).join('')}</div>` : '<div class="empty">Nenhum pedido ainda.</div>'}
  </section>
  <section class="block"><div class="head"><h2>Propostas</h2></div>
    ${propostas.length ? `<div class="list">${[...propostas].reverse().map(x => `<a href="#/ver/proposta/${x.numero}"><span><b class="num">${x.numero}</b><br><span class="muted">${dataBR(x.data)} · <span class="num">${x.itens.length}</span> produto(s)</span></span><span class="muted">${STATUS_PROPOSTA[x.status]}</span></a>`).join('')}</div>` : '<div class="empty">Nenhuma solicitação de condição comercial ainda.</div>'}
  </section>
  ${secReposicao()}`;
}

/* ---------- Navegação interna ----------
   A rota vive aqui. O endereço do navegador (#...) é atualizado quando dá; se a página
   for aberta como arquivo solto (data:, file:), o navegador bloqueia isso e a navegação segue igual. */
let rotaInterna = location.hash || '#/';
const hashAtual = () => rotaInterna;
function ir(h) {
  rotaInterna = h;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch {}
  render();
}
const sincronizar = () => { rotaInterna = location.hash || '#/'; render(); };
window.addEventListener('hashchange', sincronizar);
window.addEventListener('popstate', sincronizar);
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.target.closest('button')) return;
  e.preventDefault(); ir(a.getAttribute('href'));
}, true);

/* ---------- Roteador ---------- */
let recem = null;
function render() {
  const [rota, query] = hashAtual().slice(1).split('?');
  const partes = rota.split('/').filter(Boolean), params = new URLSearchParams(query || '');
  const intro = !partes.length;
  document.body.classList.toggle('intro', intro);
  document.body.classList.toggle('loja', !intro);
  if (intro) return;
  const [tela, a, b] = partes;
  let html;
  if (tela === 'busca') {
    const q = params.get('q')?.trim() || '';
    html = telaLista(q ? `Busca: “${q}”` : 'Todos os produtos', q ? PRODUTOS.filter(p => (p.nome + ' ' + CATEGORIAS[p.categoria]).toLowerCase().includes(q.toLowerCase())) : PRODUTOS);
  }
  else if (tela === 'catalogo') html = telaLista('Catálogo', PRODUTOS);
  else if (tela === 'categoria' && CATEGORIAS[a]) html = telaLista(CATEGORIAS[a], PRODUTOS.filter(p => p.categoria === a));
  else if (tela === 'produto' && acha(a)) html = telaProduto(acha(a));
  else if (tela === 'pedido') html = telaPedido();
  else if (tela === 'proposta') html = telaProposta(acha(params.get('p')) ? params.get('p') : null);
  else if (tela === 'ver' && a === 'pedido') html = telaDetalhe('pedido', pedidos.find(x => x.numero === b), recem === b);
  else if (tela === 'ver' && a === 'proposta') html = telaDetalhe('proposta', propostas.find(x => x.numero === b), recem === b);
  else if (tela === 'conta') html = telaConta();
  else html = telaHome(params.get('trocar') === '1');
  document.getElementById('view').innerHTML = html;
  calcularQtd(); desenharVolumes();
  window.scrollTo(0, 0);
  if (tela !== 'busca') document.querySelector('#barSearch input').value = '';
}

/* ---------- Ações ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.perfil) {
    perfil = t.dataset.perfil; salvar();
    ir(perfil === 'volume' ? '#/catalogo' : '#/atacado');
  }
  if (t.dataset.modo) {
    t.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t)); calcularQtd();
  }
  if (t.dataset.rm) { delete pedido[t.dataset.rm]; salvar(); render(); }
  if (t.dataset.repor) { e.preventDefault(); adicionar(t.dataset.repor, Number(t.dataset.q)); }
  if (t.dataset.repetir) {
    pedidos.find(x => x.numero === t.dataset.repetir).itens.forEach(i => { pedido[i.id] = (pedido[i.id] || 0) + i.q; });
    salvar(); ir('#/pedido');
  }
  if (t.dataset.avancar) {
    const [tipo, num] = t.dataset.avancar.split(':'), lista = tipo === 'pedido' ? pedidos : propostas, reg = lista.find(x => x.numero === num);
    if (reg.status < 3) { reg.status++; salvar(); render(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.closest('#qtdForm')) calcularQtd();
  if (e.target.dataset.edit) { const q = Math.floor(Number(e.target.value)); if (q > 0) { pedido[e.target.dataset.edit] = q; salvar(); } }
  if (e.target.closest('#propostaForm')) resumoProposta();
});
document.addEventListener('change', e => {
  if (e.target.name === 'prod') desenharVolumes();
  if (e.target.dataset.edit) render();
});
function faltando(f) { return [...f.querySelectorAll('[required]')].filter(i => i.type === 'checkbox' ? !i.checked : !i.value.trim()); }
const cnpjOk = v => v.replace(/\D/g, '').length === 14;
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'barSearch') { const q = f.q.value.trim(); ir('#/busca' + (q ? '?q=' + encodeURIComponent(q) : '')); }
  if (f.id === 'qtdForm') { adicionar(f.dataset.id, calcularQtd()); }
  if (f.id === 'pedidoForm') {
    const err = document.getElementById('pedidoErr'), falta = faltando(f);
    const msg = falta.some(i => i.type !== 'checkbox') ? 'Preencha os dados da empresa e da entrega.'
      : !cnpjOk(f.cnpj.value) ? 'Confira o CNPJ: são 14 números.'
      : f.cep.value.replace(/\D/g, '').length !== 8 ? 'Confira o CEP: são 8 números.'
      : falta.length ? 'Confirme que o pedido fica sujeito à confirmação de condições.' : '';
    if (msg) { err.hidden = false; err.textContent = msg; return; }
    const numero = 'ATC-' + String(pedidos.length + 1).padStart(4, '0');
    pedidos.push({ numero, data: new Date().toISOString(), status: 0, razao: f.razao.value.trim(), cidade: f.cidade.value.trim(), uf: f.uf.value.trim().toUpperCase(),
      itens: itensPedido().map(x => ({ id: x.p.id, q: x.q })) });
    pedido = {}; salvar(); recem = numero; ir('#/ver/pedido/' + numero);
  }
  if (f.id === 'propostaForm') {
    const err = document.getElementById('propErr');
    const ids = [...f.querySelectorAll('[name=prod]:checked')].map(i => i.value);
    const vols = ids.map(id => ({ id, q: Number(f.querySelector(`[data-vol="${id}"][name=q]`).value) || 0, freq: f.querySelector(`[data-vol="${id}"][name=freq]`).value }));
    const msg = !ids.length && !f.outro.value.trim() ? 'Escolha pelo menos um produto ou descreva o que procura.'
      : vols.some(v => v.q < 1) ? 'Informe as unidades de cada produto.'
      : faltando(f).length ? 'Preencha os dados da empresa.'
      : !cnpjOk(f.cnpj.value) ? 'Confira o CNPJ: são 14 números.' : '';
    if (msg) { err.hidden = false; err.textContent = msg; return; }
    const numero = 'PRP-' + String(propostas.length + 1).padStart(4, '0');
    propostas.push({ numero, data: new Date().toISOString(), status: 0, razao: f.razao.value.trim(), pagto: f.pagto.value, prazo: f.prazo.value, outro: f.outro.value.trim(), itens: vols });
    salvar(); recem = numero; ir('#/ver/proposta/' + numero);
  }
});
atualizarBarra();
render();
</script>
</body>
</html>
