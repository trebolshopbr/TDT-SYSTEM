<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDT DIGITAL</title>
<link rel="icon" href="marca/tdt-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --field: #0E0E0E;
  --line-2: #2E2E2E;
  --text: #F2F2F2;
  --muted: #8A8A8A;
  --dim: #555555;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  position: relative;
  user-select: none;
}
a { color: inherit; text-decoration: none; }
button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--text); outline-offset: 4px; }

.stage {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
}

.top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 28px 36px;
  z-index: 20;
}
.top a {
  font: 400 11px/1 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.15s;
}
.top a:hover { color: var(--text); }

.hero {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.logo-lockup {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo {
  display: block;
  width: clamp(280px, 48vw, 560px);
  max-width: 90vw;
  height: auto;
  color: var(--text);
}
.unit-tag {
  margin-top: 14px;
  font: 600 clamp(22px, 4.2vw, 44px)/1 var(--sans);
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--text);
  padding-left: 0.38em;
}

.btns {
  margin-top: 36px;
  display: flex;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 24px;
  font: 500 14px/1 var(--sans);
  border: 1px solid var(--line-2);
  color: var(--text);
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--text); color: #000; border-color: var(--text); }
.btn.pri:hover { background: #fff; }
</style>

<div class="stage">
  <header class="top">
    <a href="/">← TDT</a>
  </header>

  <main class="hero">
    <div class="logo-lockup">
      <svg class="logo" viewBox="0 0 830 259" fill="currentColor" role="img" aria-label="TDT">
        <path d="M0 0H270V52H0Z"/>
        <path d="M108 52L162 89V259H108Z"/>
        <path d="M291 0H460A100 100 0 0 1 560 100V158A100 100 0 0 1 460 258H291V89H347V201H457A44 44 0 0 0 501 157V96A44 44 0 0 0 457 52H291Z"/>
        <path d="M538 0H830V52H578A127 127 0 0 0 538 0Z"/>
        <path d="M669 52L723 89V259H669Z"/>
      </svg>
      <div class="unit-tag">DIGITAL</div>
    </div>
  </main>
</div>
